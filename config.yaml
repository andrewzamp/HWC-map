# HWC-map pipeline configuration.
# Taxa (species, search terms, colours) live in taxa.yaml.

search:
  # source: "gdelt" (GDELT DOC 2.0 API: direct article URLs, outlet-country and
  # language filters) or "googlenews" (gnews; article URLs currently cannot be
  # decoded, so extraction is headline-only).
  source: gdelt
  # One query per (taxon group × edition):
  #   (<group query_terms>) (<conflict_terms>) -"<exclude_terms>"
  # The LLM triage + extraction steps do the real relevance filtering.
  # GDELT: country = country of the OUTLET (FIPS code), language = article language.
  editions:
    - {country: US, language: en}
    - {country: CA, language: en}
    - {country: MX, language: es-419, terms: es}
  # Conflict terms. GDELT queries are length-limited, so GDELT uses only the
  # first `gdelt_conflict_terms_n` of each list, THE SAME SET FOR EVERY TAXON
  # (a taxon-dependent filter would bias between-taxa comparisons); animal
  # terms are split across several queries instead. Google News uses all.
  conflict_terms:
    en: [attack, attacked, mauled, bitten, rabid, killed, livestock, chickens, euthanized, encounter,
         attacks, bit, rabies, cattle, sheep, goats, pet, dog, cat, "broke into", conflict]
    es: [ataque, atacó, mordió, rabia, mató, ganado, gallinas, mordida, ataca, matan, borregos,
         mascota, perro, avistamiento, conflicto]
  period: 7d                  # look-back window (GDELT keeps a rolling ~3 months; e.g. 30d to backfill)
  max_results_per_query: 50   # per (group × edition) query; GDELT max 250, Google max 100
  max_new_articles: 40        # new articles accepted per run (sampled round-robin across queries)
  max_queries: null           # cap on GDELT queries per run (null = all); rotation covers the rest on later runs
  taxon_filter: null          # e.g. "coyote", "Puma concolor" or "felids"; null = all taxa
  start_date: null            # YYYY-MM-DD; with end_date, overrides `period` (GDELT: last ~3 months only)
  end_date: null
  exclude_websites: []
  # GDELT limits: query length (a 172-char query passed, 308 failed with "too
  # short or too long") and ~1 request / 5 s per IP. GitHub runners share IPs,
  # so expect 429s: back off progressively and stop at a time budget. The
  # starting query rotates daily, and the 7-day window overlaps, so a query
  # skipped one day is covered on the next.
  gdelt_max_query_chars: 230  # a query rejected as too long is split in half and retried
  gdelt_conflict_terms_n: 8
  gdelt_interval_s: 8
  gdelt_backoff_s: [20, 45, 90]
  gdelt_time_budget_s: 900

fulltext:
  enabled: true
  max_chars: 3500             # text passed to the LLM (≈900 tokens; news leads carry the facts)
  request_interval_s: 1

triage:
  # Cheap headline-only relevance check before full-text download and full
  # extraction. Only articles judged "clearly irrelevant" are skipped; "unsure"
  # goes through, so triage trades a little recall for a lot of compute.
  enabled: true

llm:
  # backend: "ollama" or "openai" (any OpenAI-compatible endpoint serving an
  # open-weight model). Env overrides: HWC_LLM_BACKEND, HWC_LLM_MODEL,
  # HWC_LLM_BASE_URL, HWC_LLM_API_KEY.
  backend: ollama
  model: qwen2.5:7b-instruct
  base_url: http://localhost:11434
  temperature: 0
  num_ctx: 8192
  num_predict: 700            # hard cap on output tokens per call
  max_retries: 2
  # Articles processed per run (triage + extraction); the rest wait for the
  # next run. Keeps a run well inside the Actions time limit.
  max_articles_per_run: 40

geocoding:
  provider: nominatim
  user_agent: "HWC-map/0.3 (+https://github.com/andrewzamp/HWC-map)"
  countrycodes: [us, ca, mx]
  min_interval_s: 1.1         # Nominatim usage policy: max 1 request/s

dedup:
  # Reports are merged into one event when ALL hold (single-linkage).
  # Same taxon = same species, or same group when species is unidentified.
  max_distance_km: 30
  max_days_apart: 3
